apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-fachai.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "game-gamerecord-fachai.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "Logging": {
         "LogLevel": {
          "Default": "Information"
          }
      },
      "GameRecord": {
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameRoundsScheduleClientBaseUrl": "http://game-gamerounds-schedule:9090/",
        "GameInterfaceClientBaseUrl": "dns:///game-gameinterface-fachai:9090/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
